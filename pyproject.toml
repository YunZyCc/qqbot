[project]
name = "qqbot"
version = "0.1.0"
description = "A single-user QQ AI companion: OneBot 11 + DeepSeek"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

# 本机「应用程序控制策略」会阻止 uv 构建临时 python.exe，
# 因此不把项目本身打包安装，运行时用 PYTHONPATH=src。
[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]
